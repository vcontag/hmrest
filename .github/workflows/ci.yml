name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Format und Vet
        run: test -z "$(gofmt -l .)" && go vet ./...
      - name: Tests
        run: go test -race ./...
      - name: Add-on-Paket bauen
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hmrest-addon
          path: dist/*.tar.gz
